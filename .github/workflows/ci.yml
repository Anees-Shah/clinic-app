name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20.x"

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  prisma:
    name: Prisma Generate & Migrate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Prisma Migrate (against Neon branch)
        if: github.event_name == 'pull_request'
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Create Neon Branch (PRs only)
        if: github.event_name == 'pull_request'
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  build:
    name: Build Next.js App
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, prisma]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build Next.js application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
          INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
          INNGEST_SIGNING_KEY: ${{ secrets.INNGEST_SIGNING_KEY }}
          GOOGLE_CALENDAR_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}
          GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}
          GOOGLE_CALENDAR_REFRESH_TOKEN: ${{ secrets.GOOGLE_CALENDAR_REFRESH_TOKEN }}
          FREE_CANCEL_HOURS: 48

  deploy-preview:
    name: Deploy Preview to Vercel
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel Preview
        run: vercel --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --prod=false
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment PR with Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Preview deployment ready! Check the Vercel dashboard for the preview URL.'
            })

  deploy-production:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Migrate production database (Neon)
        run: |
          # ONE-TIME BASELINE (P3005 self-heal): the production Neon branch was
          # created with tables already present (db:push-style state) but no
          # _prisma_migrations history. prisma/schema.prisma has not changed since
          # Phase 0 and the single migration 20260831_init matches those tables,
          # so marking it applied is safe HERE AND ONLY HERE.
          # This does NOT mask real migration errors: only the literal P3005
          # "database schema is not empty" triggers resolve+retry; any other
          # failure (or a failed retry) exits non-zero and fails the step loudly.
          # RELIABILITY NOTE: GitHub runs each step with `bash -e -o pipefail`.
          # A bare `OUTPUT=$(npx ...)` is NOT exempt from `set -e` on all bash
          # versions — a failing npx inside $() can kill the whole step BEFORE
          # our handling runs (suspect for run #8: red with no "P3005 detected"
          # line). Commands in an `if` condition ARE exempt by POSIX guarantee,
          # so every fallible command below sits in an `if` test. No `set +e`
          # reliance, no bare STATUS=$? after $(). P3005-only gate unchanged.
          if OUTPUT=$(npx prisma migrate deploy 2>&1); then
            echo "$OUTPUT"
            echo "Migrations applied cleanly."
          else
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q "P3005"; then
              echo "P3005 detected (pre-existing schema, no migration history) - baselining 20260831_init once, then retrying..."
              if RESOLVE_OUT=$(npx prisma migrate resolve --applied "20260831_init" 2>&1); then
                echo "$RESOLVE_OUT"
                echo "Baseline recorded. Retrying migrate deploy..."
                npx prisma migrate deploy
              else
                echo "$RESOLVE_OUT"
                echo "Baseline resolve failed - failing loudly (check DATABASE_URL points at the PRODUCTION branch, pooled string, branch awake)."
                exit 1
              fi
            else
              echo "Migration failed with a non-P3005 error - failing loudly (no baseline attempted)."
              exit 1
            fi
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel Production
        run: |
          # Trim whitespace/CRLF from pasted secrets (PowerShell copy-paste often adds
          # trailing spaces/newlines) — pure shell parameter expansion, values never printed.
          trim_ws() {
            local _v="$1"
            _v="${_v#"${_v%%[![:space:]]*}"}"
            _v="${_v%"${_v##*[![:space:]]}"}"
            _v="${_v//$'\r'/}"
            printf '%s' "$_v"
          }
          VERCEL_TOKEN="$(trim_ws "${VERCEL_TOKEN:-}")"
          VERCEL_ORG_ID="$(trim_ws "${VERCEL_ORG_ID:-}")"
          VERCEL_PROJECT_ID="$(trim_ws "${VERCEL_PROJECT_ID:-}")"
          # Preflight 1: shape check (fail fast on swap/typo, values never printed).
          # All tests sit in `||`/case/`if` positions: safe under `bash -e -o pipefail`.
          bad=""
          [ -n "$VERCEL_TOKEN" ] || bad="$bad VERCEL_TOKEN(missing/empty)"
          case "${VERCEL_ORG_ID:-}" in team_*) ;; *) bad="$bad VERCEL_ORG_ID(must start with team_ - check swap/typo)";; esac
          case "${VERCEL_PROJECT_ID:-}" in prj_*) ;; *) bad="$bad VERCEL_PROJECT_ID(must start with prj_ - check swap/typo)";; esac
          if [ -n "$bad" ]; then
            echo "Vercel secret shape check failed:$bad - fix under GitHub repo Settings > Secrets and variables > Actions (prefixes only: org=team_..., project=prj_...), then Re-run failed jobs."
            exit 1
          fi
          # Preflight 2: REST diagnosis via Vercel API (curl, already on runner) BEFORE the CLI,
          # so the log names the exact broken piece instead of 'Could not retrieve Project Settings'.
          # Values never printed. Every fallible command sits in an `if` condition (POSIX `set -e` exemption).
          TMP_RESP="$(mktemp)"
          if ! HTTP_CODE="$(curl -s -o "$TMP_RESP" -w "%{http_code}" --max-time 20 -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID")"; then
            echo "Could not reach Vercel API to verify secrets (network/curl failed) - check runner network, then Re-run failed jobs; if it persists, re-enter VERCEL_TOKEN under GitHub repo Settings > Secrets and variables > Actions."
            rm -f "$TMP_RESP"
            exit 1
          fi
          case "$HTTP_CODE" in
            200)
              echo "Vercel API preflight: token + project ID OK (200)."
              ;;
            401|403)
              echo "Vercel API preflight returned $HTTP_CODE - VERCEL_TOKEN is invalid or has no access to this team/project - fix under GitHub repo Settings > Secrets and variables > Actions: recreate VERCEL_TOKEN with Full Account scope and re-enter it carefully, then Re-run failed jobs."
              rm -f "$TMP_RESP"
              exit 1
              ;;
            404)
              echo "Vercel API preflight returned 404 - VERCEL_PROJECT_ID is wrong or the token cannot see it - fix under GitHub repo Settings > Secrets and variables > Actions: re-copy VERCEL_PROJECT_ID carefully (must start with prj_...), then Re-run failed jobs."
              rm -f "$TMP_RESP"
              exit 1
              ;;
            *)
              echo "Vercel API preflight returned unexpected HTTP $HTTP_CODE - check VERCEL_TOKEN / VERCEL_PROJECT_ID / VERCEL_ORG_ID under GitHub repo Settings > Secrets and variables > Actions, re-enter the wrong one carefully, then Re-run failed jobs."
              rm -f "$TMP_RESP"
              exit 1
              ;;
          esac
          # Preflight 3: confirm the project belongs to org VERCEL_ORG_ID (response accountId must match;
          # mismatch = org secret is wrong, likely swapped with project). Values never printed.
          if ! ACCOUNT_ID="$(grep -o '"accountId":"[^"]*"' "$TMP_RESP" | head -n1 | cut -d'"' -f4)"; then
            echo "Vercel API preflight: could not read project org from API response - check VERCEL_TOKEN / VERCEL_PROJECT_ID under GitHub repo Settings > Secrets and variables > Actions, then Re-run failed jobs."
            rm -f "$TMP_RESP"
            exit 1
          fi
          if [ -z "$ACCOUNT_ID" ]; then
            echo "Vercel API preflight: could not read project org from API response - check VERCEL_TOKEN / VERCEL_PROJECT_ID under GitHub repo Settings > Secrets and variables > Actions, then Re-run failed jobs."
            rm -f "$TMP_RESP"
            exit 1
          fi
          if [ "$ACCOUNT_ID" != "$VERCEL_ORG_ID" ]; then
            echo "Vercel API preflight: project belongs to a different org than VERCEL_ORG_ID - VERCEL_ORG_ID is wrong (likely swapped with VERCEL_PROJECT_ID) - fix under GitHub repo Settings > Secrets and variables > Actions: re-enter VERCEL_ORG_ID carefully (must start with team_...), then Re-run failed jobs."
            rm -f "$TMP_RESP"
            exit 1
          fi
          echo "Vercel API preflight: org match confirmed."
          rm -f "$TMP_RESP"
          # All checks passed - actual deploy (previously failed with 'Could not retrieve Project Settings' when IDs/token did not resolve).
          # FIX kept: no --scope (with VERCEL_ORG_ID/VERCEL_PROJECT_ID env set the CLI already knows org+project); --yes kept (no interactive hang).
          vercel --token="$VERCEL_TOKEN" --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # NOTE: no Neon "promote" step — production is a dedicated `production`
          # branch (migrated above); there is no promote-branch action and none needed.