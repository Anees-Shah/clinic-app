# ONE-OFF production baseline (P3005 fix). DELETE THIS FILE after it goes green.
# Run manually: GitHub repo → Actions → "One-off production baseline" → Run workflow.
# Marks 20260831_init as applied on the production DB without touching tables.
name: One-off production baseline

on:
  workflow_dispatch:

jobs:
  baseline:
    name: Mark initial migration as applied
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Baseline production database
        run: npx prisma migrate resolve --applied "20260831_init"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
